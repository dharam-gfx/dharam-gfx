<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dharam | Profile Assets</title>
    <style>
        :root {
            color-scheme: dark;
            font: 15px/1.5 "Segoe UI", sans-serif;
        }

        body {
            margin: 0;
            padding: 32px;
            background: #0d1117;
            color: #d7e0e8;
        }

        main {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            color: #22d3ee;
            font-size: 24px;
        }

        h2 {
            margin: 34px 0 12px;
            color: #aab4bf;
            font: 12px Consolas, monospace;
        }

        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            align-items: flex-start;
        }

        figure {
            margin: 0;
            padding: 14px;
            min-width: 0;
            background: #111821;
            border: 1px solid #303a43;
            border-radius: 8px;
        }

        figcaption {
            margin-bottom: 10px;
            color: #8b949e;
            font: 11px Consolas, monospace;
        }

        img {
            display: block;
            max-width: 100%;
            height: auto;
        }

        .wide {
            flex: 1 1 620px;
        }

        .card {
            flex: 1 1 420px;
        }

        .light {
            color-scheme: light;
            background: #f6f8fa;
            color: #263541;
        }

        @media (max-width: 600px) {
            body {
                padding: 16px;
            }

            figure {
                padding: 10px;
            }
        }
    </style>
</head>

<body>
    <main>
        <h1>Profile assets</h1>
        <h2>BANNER</h2>
        <div class="row">
            <figure class="wide">
                <figcaption>Dark theme</figcaption><img src="assets/banner-dark.svg" alt="Dark profile banner">
            </figure>
            <figure class="wide light">
                <figcaption>Light theme</figcaption><img src="assets/banner-light.svg" alt="Light profile banner">
            </figure>
        </div>
        <h2>GITHUB CARDS</h2>
        <div class="row">
            <figure class="card">
                <figcaption>Statistics / dark</figcaption><img src="assets/card-stats-dark.svg"
                    alt="Dark GitHub stats card">
            </figure>
            <figure class="card light">
                <figcaption>Statistics / light</figcaption><img src="assets/card-stats-light.svg"
                    alt="Light GitHub stats card">
            </figure>
            <figure class="card">
                <figcaption>Languages / dark</figcaption><img src="assets/card-languages-dark.svg"
                    alt="Dark language card">
            </figure>
            <figure class="card light">
                <figcaption>Languages / light</figcaption><img src="assets/card-languages-light.svg"
                    alt="Light language card">
            </figure>
        </div>
    </main>
</body>

</html>
